[project]
name = "olist-ecommerce-data-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "adnan-amrs", email = "adnane.amrouss@usms.ac.ma" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.6",
    "dbt-postgres>=1.11.0",
    "pandas>=3.1.1",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
olist-ecommerce-data-platform = "olist_ecommerce_data_platform:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "sqlfluff>=4.5.0",
]
